<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Ask Experts</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Poppins',sans-serif;
}

/* APP BACKGROUND */

body{

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);

}

/* BACKGROUND IMAGE LAYER */

body:before{

content:"";
position:fixed;
top:0;
left:0;
right:0;
bottom:0;

background:url("https://images.unsplash.com/photo-1581092795360-fd1ca04f0952");

background-size:cover;
background-position:center;

opacity:.18;
z-index:-1;

}

/* GLASS CARD */

.register-box{

width:420px;
padding:40px 30px;
border-radius:20px;

background:rgba(255,255,255,0.12);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,0.2);

box-shadow:0 30px 80px rgba(0,0,0,0.45);

color:white;

text-align:center;

animation:floatCard 6s ease-in-out infinite;

}

/* FLOAT ANIMATION */

@keyframes floatCard{

0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}

}

/* HEADER */

.header-box{
margin-bottom:25px;
}

.app-title{

font-size:34px;
font-weight:600;

color:#4dd0e1;

margin-bottom:5px;

}

.app-sub{

font-size:14px;
opacity:.8;

}

/* INPUT GROUP */

.input-group{

position:relative;
margin:15px 0;

}

.input-group i{

position:absolute;

left:12px;
top:50%;

transform:translateY(-50%);

color:#ddd;

}

input,select{

width:100%;

padding:12px 12px 12px 40px;

border-radius:8px;

border:none;

background:rgba(255,255,255,0.2);

color:white;

font-size:14px;

outline:none;

transition:.3s;

}

input::placeholder{
color:#eee;
}

input:focus,select:focus{

background:rgba(255,255,255,0.35);

box-shadow:0 0 10px rgba(255,255,255,0.4);

}

/* BUTTON */

button{

width:100%;

padding:13px;

border:none;

border-radius:8px;

margin-top:10px;

font-size:15px;

cursor:pointer;

transition:0.3s;

font-weight:500;

}

/* SEND OTP */

button:nth-of-type(1){

background:linear-gradient(45deg,#ff9800,#ff5722);
color:white;

}

/* VERIFY OTP */

button:nth-of-type(2){

background:linear-gradient(45deg,#00c853,#2e7d32);
color:white;

}

/* REGISTER */

button[type="submit"]{

background:linear-gradient(45deg,#00c6ff,#0072ff);

color:white;

}

button:hover{

transform:scale(1.05);

box-shadow:0 10px 25px rgba(0,0,0,0.4);

}

/* FILE */

input[type=file]{

background:rgba(255,255,255,0.2);

padding:10px;

}

/* LABEL */

label{

display:block;

margin-top:10px;

font-size:13px;

text-align:left;

color:#eee;

}

/* NAV BUTTONS */

.navigation-buttons{

display:flex;

gap:10px;

margin-top:20px;

}

.navigation-buttons button{

width:33%;

font-size:13px;

}

.register-btn{background:#4caf50;}
.login-btn{background:#2196f3;}
.ask-btn{background:#ff9800;}

/* MOBILE */

@media(max-width:480px){

.register-box{

width:95%;
padding:30px 20px;

}

.app-title{
font-size:26px;
}

}

</style>

</head>

<body>

<div class="register-box">

<div class="header-box">
<h1 class="app-title">💡 Ask Experts</h1>
<div class="app-sub">Create your expert account</div>
</div>

<form onsubmit="return registerUser()">

<div class="input-group">
<i class="fa fa-user"></i>
<input id="name" type="text" placeholder="Full Name" required>
</div>

<div class="input-group">
<i class="fa fa-envelope"></i>
<input id="email" type="email" placeholder="Email Address" required>
</div>

<div class="input-group">
<i class="fa fa-lock"></i>
<input id="password" type="password" placeholder="Password" required>
</div>

<div class="input-group">
<i class="fa fa-phone"></i>
<input id="phone" type="tel" placeholder="Mobile Number" required>
</div>

<button type="button" onclick="sendOTP()">Send OTP</button>

<div class="input-group">
<i class="fa fa-key"></i>
<input id="otp" placeholder="Enter OTP">
</div>

<button type="button" onclick="verifyOTP()">Verify OTP</button>

<select id="accountType" onchange="toggleProfession()" required>

<option value="">Select Account Type</option>
<option value="user">User</option>
<option value="expert">Professional</option>

</select>

<select id="profession" disabled>

<option value="">Select Profession</option>
<option>Lawyer</option>
<option>Doctor</option>
<option>Engineer</option>
<option>Teacher</option>
<option>Police</option>
<option>Business Expert</option>
<option>IT Support</option>
<option>Psychologist</option>
<option>Career Advisor</option>

</select>

<input id="course" placeholder="Course (Example: MBBS)" disabled>

<label>Upload Certificate</label>
<input id="certificateUpload" type="file" disabled>

<label>
<input type="checkbox" id="talentRequest" disabled>
Request admin verification
</label>

<button type="submit">Register</button>

</form>

<div class="navigation-buttons">

<button class="register-btn" onclick="location.href='register.html'">Register</button>

<button class="login-btn" onclick="location.href='login.html'">Login</button>

<button class="ask-btn" onclick="location.href='ask.html'">Ask</button>

</div>

</div>

<script>

/* YOUR ORIGINAL JAVASCRIPT (UNCHANGED) */

function getUsers(){
try{
let data = JSON.parse(localStorage.getItem("users"));
return Array.isArray(data) ? data : [];
}catch(e){
return [];
}
}

let verified=false;

function sendOTP(){

let phone=document.getElementById("phone").value.trim();

if(!/^[0-9]{10}$/.test(phone)){
alert("Enter valid 10 digit phone number");
return;
}

let otp=Math.floor(100000+Math.random()*900000);

localStorage.setItem("otp",otp);

alert("OTP: "+otp);

}

function verifyOTP(){

let entered=document.getElementById("otp").value;

let real=localStorage.getItem("otp");

if(!real){
alert("Send OTP first");
return;
}

if(entered===real){
verified=true;
localStorage.removeItem("otp");
alert("OTP Verified");
}else{
verified=false;
alert("Wrong OTP");
}

}

function toggleProfession(){

let type=document.getElementById("accountType").value;

let profession=document.getElementById("profession");
let course=document.getElementById("course");
let certificate=document.getElementById("certificateUpload");
let talent=document.getElementById("talentRequest");

let enable = type==="expert";

profession.disabled=!enable;
course.disabled=!enable;
certificate.disabled=!enable;
talent.disabled=!enable;

}

function checkCertificate(file){

if(!file) return null;

let name=file.name.toLowerCase();

if(name.includes("mbbs") || name.includes("llb") || name.includes("btech") || name.includes("degree")){
return "verified";
}

return "pending";

}

function registerUser(){

if(!verified){
alert("Verify OTP first");
return false;
}

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim().toLowerCase();
let password=document.getElementById("password").value;
let phone=document.getElementById("phone").value.trim();

let role=document.getElementById("accountType").value;
let profession=document.getElementById("profession").value;
let course=document.getElementById("course").value;

let file=document.getElementById("certificateUpload").files[0];
let talent=document.getElementById("talentRequest").checked;

let users=getUsers();

if(users.some(u=>u.email===email)){
alert("Email already registered");
return false;
}

let status="active";

if(role==="expert"){

if(!profession){
alert("Select profession");
return false;
}

if(file){
status=checkCertificate(file);
}
else if(talent){
status="admin_review";
}
else{
alert("Upload certificate or request admin review");
return false;
}

}

let user={
id:Date.now(),
name:name,
email:email,
password:password,
phone:phone,
role:role || "user",
profession:profession || "",
course:course || "",
certificate:file?file.name:"",
status:status
};

users.push(user);

localStorage.setItem("users",JSON.stringify(users));

alert("Registration Successful!");

window.location.href="login.html";

return false;

}

</script>

</body>
</html>
