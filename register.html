<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - AskExpert</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

/* background image */

body:before{
content:"";
position:fixed;
top:0;
left:0;
right:0;
bottom:0;

background:url("https://images.unsplash.com/photo-1581092795360-fd1ca04f0952");

background-size:cover;
background-position:center;

opacity:.18;
z-index:-1;
}

/* glass card */

.register-box{
width:420px;
padding:40px 30px;
border-radius:20px;

background:rgba(255,255,255,0.12);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,0.2);

box-shadow:0 30px 80px rgba(0,0,0,0.45);

color:white;
text-align:center;
}

.app-title{
font-size:34px;
font-weight:600;
color:#4dd0e1;
margin-bottom:5px;
}

.app-sub{
font-size:14px;
opacity:.8;
margin-bottom:20px;
}

.input-group{
position:relative;
margin:12px 0;
}

.input-group i{
position:absolute;
left:12px;
top:50%;
transform:translateY(-50%);
color:#ddd;
}

input,select{
width:100%;
padding:12px 12px 12px 40px;
border-radius:8px;
border:none;
background:rgba(255,255,255,0.2);
color:white;
font-size:14px;
outline:none;
}

input::placeholder{
color:#eee;
}

/* expert section */

#expertFields{
display:none;
margin-top:15px;
padding:12px;
border-radius:10px;
background:rgba(255,255,255,0.08);
}

/* buttons */

button{
width:100%;
padding:13px;
border:none;
border-radius:8px;
margin-top:10px;
font-size:15px;
cursor:pointer;
font-weight:500;
transition:.3s;
}

.otp-btn{
background:linear-gradient(45deg,#ff9800,#ff5722);
}

.verify-btn{
background:linear-gradient(45deg,#00c853,#2e7d32);
}

.register-btn{
background:linear-gradient(45deg,#00c6ff,#0072ff);
}

button:hover{
transform:scale(1.05);
}

/* navigation buttons */

.navigation-buttons{
display:flex;
gap:10px;
margin-top:20px;
}

.navigation-buttons button{
width:33%;
font-size:13px;
}

.nav-register{background:#4caf50;}
.nav-login{background:#2196f3;}
.nav-ask{background:#ff9800;}

label{
display:block;
margin-top:10px;
font-size:13px;
text-align:left;
}

</style>
</head>

<body>

<div class="register-box">

<h1 class="app-title">💡 AskExpert</h1>
<div class="app-sub">Create your account</div>

<form onsubmit="return registerUser()">

<div class="input-group">
<i class="fa fa-user"></i>
<input id="name" type="text" placeholder="Full Name" required>
</div>

<div class="input-group">
<i class="fa fa-envelope"></i>
<input id="email" type="email" placeholder="Email Address" required>
</div>

<div class="input-group">
<i class="fa fa-lock"></i>
<input id="password" type="password" placeholder="Password" required>
</div>

<div class="input-group">
<i class="fa fa-phone"></i>
<input id="phone" type="tel" placeholder="Mobile Number" required>
</div>

<button type="button" class="otp-btn" onclick="sendOTP()">Send OTP</button>

<div class="input-group">
<i class="fa fa-key"></i>
<input id="otp" placeholder="Enter OTP">
</div>

<button type="button" class="verify-btn" onclick="verifyOTP()">Verify OTP</button>

<select id="accountType" onchange="toggleExpert()" required>

<option value="">Select Account Type</option>
<option value="user">User</option>
<option value="expert">Professional</option>

</select>

<!-- PROFESSIONAL FIELDS -->

<div id="expertFields">

<select id="profession">
<option value="">Select Profession</option>
<option>Doctor</option>
<option>Lawyer</option>
<option>Engineer</option>
<option>Teacher</option>
<option>Police</option>
<option>IT Support</option>
<option>Psychologist</option>
<option>Career Advisor</option>
</select>

<input id="course" placeholder="Course (Example: MBBS)">

<label>Upload Certificate</label>
<input id="certificateUpload" type="file">

<label>
<input type="checkbox" id="adminRequest">
Request admin verification
</label>

</div>

<button type="submit" class="register-btn">Register</button>

</form>

<div class="navigation-buttons">

<button class="nav-register" onclick="location.href='register.html'">Register</button>

<button class="nav-login" onclick="location.href='login.html'">Login</button>

<button class="nav-ask" onclick="location.href='ask.html'">Ask</button>

</div>

</div>

<script>

/* STORAGE */

function getUsers(){
try{
let data=JSON.parse(localStorage.getItem("users"));
return Array.isArray(data)?data:[];
}catch{
return [];
}
}

let otpVerified=false;

/* OTP */

function sendOTP(){

let phone=document.getElementById("phone").value.trim();

if(!/^[0-9]{10}$/.test(phone)){
alert("Enter valid phone number");
return;
}

let otp=Math.floor(100000+Math.random()*900000);

localStorage.setItem("otp",otp);

alert("Your OTP: "+otp);

}

function verifyOTP(){

let entered=document.getElementById("otp").value;
let real=localStorage.getItem("otp");

if(entered===real){

otpVerified=true;

alert("OTP Verified");

}else{

alert("Wrong OTP");

}

}

/* SHOW EXPERT FIELDS */

function toggleExpert(){

let type=document.getElementById("accountType").value;

let expertFields=document.getElementById("expertFields");

if(type==="expert"){

expertFields.style.display="block";

}else{

expertFields.style.display="none";

}

}

/* AI CERTIFICATE CHECK */

function aiCheck(file){

if(!file) return "invalid";

let name=file.name.toLowerCase();

if(
name.includes("mbbs") ||
name.includes("btech") ||
name.includes("degree") ||
name.includes("llb")
){
return "verified";
}

return "manual";

}

/* REGISTER */

function registerUser(){

if(!otpVerified){
alert("Verify OTP first");
return false;
}

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim().toLowerCase();
let password=document.getElementById("password").value;
let phone=document.getElementById("phone").value.trim();

let role=document.getElementById("accountType").value;

let profession=document.getElementById("profession").value;
let course=document.getElementById("course").value;

let file=document.getElementById("certificateUpload").files[0];
let admin=document.getElementById("adminRequest").checked;

let users=getUsers();

/* duplicate email */

if(users.some(u=>u.email===email)){
alert("Email already exists");
return false;
}

let status="active";

if(role==="expert"){

if(!profession){
alert("Select profession");
return false;
}

if(file){

let result=aiCheck(file);

if(result==="verified"){

status="verified";
alert("AI verified certificate");

}else{

status="admin_review";
alert("Certificate needs admin verification");

}

}else if(admin){

status="admin_review";

}else{

alert("Upload certificate or request admin verification");
return false;

}

}

let user={

id:Date.now(),

name:name,
email:email,
password:password,
phone:phone,

role:role || "user",

profession:profession || "",

course:course || "",

certificate:file?file.name:"",

status:status

};

users.push(user);

localStorage.setItem("users",JSON.stringify(users));

alert("Registration successful");

window.location.href="login.html";

return false;

}

</script>

</body>
</html>
