<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - AskExpert</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Segoe UI',Arial;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
url("https://images.unsplash.com/photo-1557804506-669a67965ba0?w=1600");

background-size:cover;
background-position:center;
}

/* LOGIN CARD */

.login-box{

background:rgba(255,255,255,0.15);
backdrop-filter:blur(18px);

padding:45px;
border-radius:22px;

width:380px;

box-shadow:0 30px 70px rgba(0,0,0,0.5);

text-align:center;

color:white;

animation:floatCard 6s ease-in-out infinite;

}

@keyframes floatCard{
0%{transform:translateY(0px);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0px);}
}

/* TITLE */

.logo{
font-size:30px;
font-weight:700;
margin-bottom:10px;
}

.logo i,.logo span{
color:#ffd54f;
}

.subtitle{
font-size:14px;
opacity:.9;
margin-bottom:25px;
}

/* INPUTS */

.input-group{
position:relative;
margin-bottom:18px;
}

.input-group i{
position:absolute;
left:12px;
top:50%;
transform:translateY(-50%);
color:white;
opacity:.8;
}

input{
width:100%;
padding:13px 12px 13px 40px;
border-radius:12px;
border:none;
font-size:14px;
outline:none;
background:rgba(255,255,255,0.18);
color:white;
}

input:focus{
background:rgba(255,255,255,0.28);
}

/* BUTTONS */

button{
width:100%;
padding:13px;
border:none;
border-radius:12px;
font-size:15px;
cursor:pointer;
margin-top:10px;
transition:.25s;
}

.login-btn{
background:linear-gradient(90deg,#2196f3,#42a5f5);
color:white;
}

.login-btn:hover{
transform:scale(1.04);
}

.show-btn{
background:#546e7a;
color:white;
}

/* NAV BUTTONS */

.navigation-buttons{
display:flex;
gap:10px;
margin-top:20px;
}

.navigation-buttons button{
flex:1;
padding:10px;
font-size:13px;
}

.register-btn{
background:#4caf50;
color:white;
}

.ask-btn{
background:#ff9800;
color:white;
}

/* LINK */

.register-link{
margin-top:18px;
font-size:14px;
}

.register-link a{
color:#ffd54f;
font-weight:bold;
text-decoration:none;
}

</style>
</head>

<body>

<div class="login-box">

<div class="logo">
<i class="fa-solid fa-user-doctor"></i>
Ask<span>Expert</span>
</div>

<div class="subtitle">
Ask questions from verified professionals
</div>

<form id="loginForm">

<div class="input-group">
<i class="fa fa-envelope"></i>
<input type="email" id="loginEmail" placeholder="Enter Email" required>
</div>

<div class="input-group">
<i class="fa fa-lock"></i>
<input type="password" id="loginPassword" placeholder="Enter Password" required>
</div>

<button type="button" class="show-btn" onclick="togglePassword()">
Show / Hide Password
</button>

<button type="submit" id="loginBtn" class="login-btn">
Login
</button>

</form>

<div class="navigation-buttons">

<button class="register-btn" onclick="location.href='register.html'">
Register
</button>

<button class="ask-btn" onclick="location.href='ask.html'">
Ask
</button>

</div>

<div class="register-link">
<p>Don't have an account?</p>
<a href="register.html">Register Here</a>
</div>

</div>

<script>

/* SAFE JSON */

function getData(key){

try{

let data = JSON.parse(localStorage.getItem(key));

if(Array.isArray(data) || typeof data === "object"){
return data;
}

return [];

}catch(e){

return [];

}

}

/* FULL XSS PROTECTION */

function safe(text){

if(!text) return "";

return text.toString()
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* LOGIN */

document.getElementById("loginForm").addEventListener("submit",loginUser);

function loginUser(e){

e.preventDefault();

/* prevent double click */

let btn=document.getElementById("loginBtn");
btn.disabled=true;

let email=document.getElementById("loginEmail").value.trim().toLowerCase();
let password=document.getElementById("loginPassword").value.trim();

if(email==="" || password===""){

alert("Please enter email and password");
btn.disabled=false;
return;

}

/* email format */

let emailRegex=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if(!emailRegex.test(email)){

alert("Invalid email format");
btn.disabled=false;
return;

}

let users=getData("users");

let user=users.find(u =>

u.email &&
u.password &&
u.email.toLowerCase()===email &&
u.password===password

);

if(!user){

alert("Invalid email or password");
btn.disabled=false;
return;

}

/* banned */

if(user.banned){

alert("Your account is banned");
btn.disabled=false;
return;

}

/* corrupted object protection */

if(typeof user !== "object"){

alert("Session error. Please login again");
btn.disabled=false;
return;

}

/* save login */

localStorage.setItem("loggedInUser",JSON.stringify(user));

let username=safe(user.name || "User");

alert("Welcome "+username);

/* role redirect */

if(user.role==="admin"){

window.location.href="admin.html";

}
else if(user.role==="expert"){

window.location.href="dashboard.html";

}
else{

window.location.href="ask.html";

}

}

/* PASSWORD TOGGLE */

function togglePassword(){

let pass=document.getElementById("loginPassword");

pass.type = (pass.type==="password") ? "text" : "password";

}

</script>

</body>
</html>
