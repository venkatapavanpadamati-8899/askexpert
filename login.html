
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - AskExpert</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"> 
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.55)),
url("https://images.unsplash.com/photo-1556761175-4b46a572b786") center/cover no-repeat;
animation:bgMove 15s infinite alternate;
overflow:hidden;
}

@keyframes bgMove{
0%{transform:scale(1);}
100%{transform:scale(1.08);}
}

.login-box{
width:380px;
padding:40px;
border-radius:20px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.2);
box-shadow:0 20px 60px rgba(0,0,0,0.4);
color:white;
text-align:center;
animation:floatCard 6s ease-in-out infinite;
}

@keyframes floatCard{
0%{transform:translateY(0);}
50%{transform:translateY(-8px);}
100%{transform:translateY(0);}
}

.logo{
font-size:36px;
font-weight:600;
margin-bottom:10px;
}

.logo i{
color:#ffd54f;
margin-right:8px;
}

.ask{color:white;}
.expert{color:#ffd54f;}

.subtitle{
font-size:16px;
opacity:.85;
margin-bottom:30px;
}

.input-group{
position:relative;
margin:15px 0;
}

.input-group i{
position:absolute;
left:12px;
top:50%;
transform:translateY(-50%);
color:#eee;
}

input{
width:100%;
padding:12px 12px 12px 40px;
border-radius:10px;
border:none;
background:rgba(255,255,255,0.2);
color:white;
outline:none;
font-size:15px;
}

input::placeholder{color:#ddd;}

button{
width:100%;
padding:14px;
border-radius:10px;
border:none;
font-size:16px;
cursor:pointer;
background:linear-gradient(45deg,#00c6ff,#0072ff);
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

.navigation{
display:flex;
gap:12px;
margin-top:20px;
}

.navigation button{
flex:1;
font-size:14px;
padding:10px;
}

.register{background:linear-gradient(45deg,#4caf50,#388e3c);}
.ask-btn{background:linear-gradient(45deg,#ff9800,#f57c00);}

</style>
</head>

<body>

<div class="login-box">

<div class="logo">
<i class="fa-solid fa-user-doctor"></i>
<span class="ask">Ask</span><span class="expert">Expert</span>
</div>

<p class="subtitle">Ask questions from verified professionals</p>

<form onsubmit="return loginUser()">

<div class="input-group">
<i class="fa fa-envelope"></i>
<input id="email" type="email" placeholder="Email Address" required>
</div>

<div class="input-group">
<i class="fa fa-lock"></i>
<input id="password" type="password" placeholder="Password" required>
</div>

<button id="loginBtn" type="submit">Login</button>

</form>

<div class="navigation">
<button class="register" onclick="location.href='register.html'">Register</button>
<button class="ask-btn" onclick="location.href='ask.html'">Ask Question</button>
</div>

</div>

<script>

/* LOGIN USING LOCAL STORAGE */

function loginUser(){

let email = document.getElementById("email").value.trim().toLowerCase();
let password = document.getElementById("password").value.trim();
let btn = document.getElementById("loginBtn");

if(!email || !password){
alert("Please enter both email and password");
return false;
}

btn.disabled = true;
btn.innerText = "Logging in...";

/* GET USERS */

let users = JSON.parse(localStorage.getItem("users")) || [];

/* FIND USER */

let user = users.find(u => u.email === email && u.password === password);

if(!user){

alert("Invalid email or password");

btn.disabled=false;
btn.innerText="Login";

return false;

}

/* CHECK BAN */

if(user.banned === true){

alert("Your account has been banned");

btn.disabled=false;
btn.innerText="Login";

return false;

}

/* SAVE SESSION */

localStorage.setItem("loggedInUser", JSON.stringify(user));

alert("Login successful");

/* REDIRECT BASED ON ROLE */

if(user.role === "expert"){

window.location.href = "expert-dashboard.html";

}else{

window.location.href = "ask.html";

}

return false;

}

</script>

</body>
</html>
