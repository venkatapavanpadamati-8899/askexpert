<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AskExpert Platform</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* GLOBAL RESET */

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Segoe UI',Arial,sans-serif;
}

/* BODY */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)),
url("https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=1600")
center/cover no-repeat;

animation:bgPulse 10s ease-in-out infinite alternate;
}

/* BACKGROUND ANIMATION */

@keyframes bgPulse{
0%{filter:brightness(1);}
50%{filter:brightness(1.1);}
100%{filter:brightness(1);}
}

/* MAIN CARD */

.container{
text-align:center;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
padding:60px;
border-radius:25px;
box-shadow:0 25px 60px rgba(0,0,0,0.4);
color:white;
max-width:520px;
animation:fadeIn 1s,floatCard 6s ease-in-out infinite;
}

/* TITLE */

.title{
font-size:42px;
font-weight:700;
margin-bottom:10px;
}

.title span{
color:#ffd54f;
}

/* SUBTITLE */

.subtitle{
font-size:18px;
opacity:.9;
margin-bottom:35px;
}

/* ICONS */

.experts{
display:flex;
justify-content:center;
gap:20px;
margin-bottom:30px;
font-size:28px;
}

.experts i{
background:rgba(255,255,255,0.2);
padding:12px;
border-radius:50%;
transition:.3s;
}

.experts i:hover{
background:rgba(255,255,255,0.4);
transform:scale(1.2);
}

/* BUTTONS */

.buttons{
display:flex;
gap:12px;
justify-content:center;
flex-wrap:wrap;
}

button{
padding:14px 28px;
border-radius:30px;
font-size:18px;
color:white;
border:none;
cursor:pointer;
transition:.3s;
display:flex;
align-items:center;
gap:8px;
}

/* BUTTON COLORS */

.register{background:#28a745;}
.register:hover{background:#1e7e34;transform:scale(1.1);}

.login{background:#007bff;}
.login:hover{background:#0056b3;transform:scale(1.1);}

.ask{background:#ff9800;}
.ask:hover{background:#e68900;transform:scale(1.1);}

/* ANIMATIONS */

@keyframes fadeIn{
from{opacity:0;transform:translateY(-30px);}
to{opacity:1;transform:translateY(0);}
}

@keyframes floatCard{
0%{transform:translateY(0px);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0px);}
}

/* MOBILE */

@media(max-width:500px){

.container{padding:35px;}

.title{font-size:32px;}

.subtitle{font-size:16px;}

}

</style>
</head>

<body>

<div class="container">

<h1 class="title">Ask<span>Expert</span></h1>

<p class="subtitle">
Ask questions from verified professionals like Lawyers, Doctors, Teachers, and Engineers.
</p>

<div class="experts">

<i class="fa-solid fa-user-doctor" title="Doctor"></i>
<i class="fa-solid fa-scale-balanced" title="Lawyer"></i>
<i class="fa-solid fa-laptop-code" title="Engineer"></i>
<i class="fa-solid fa-graduation-cap" title="Teacher"></i>

</div>

<div class="buttons">

<button class="register" onclick="goRegister()">
<i class="fa-solid fa-user-plus"></i> Register
</button>

<button class="login" onclick="goLogin()">
<i class="fa-solid fa-right-to-bracket"></i> Login
</button>

<button class="ask" onclick="goToAsk()">
<i class="fa-solid fa-question"></i> Ask Question
</button>

</div>

</div>

<script>

/* SAFE JSON FUNCTION */

function getData(key){

try{
let data = JSON.parse(localStorage.getItem(key));
return data ? data : null;
}
catch(e){
return null;
}

}

/* SAFE TEXT (future use) */

function safe(text){
if(!text) return "";
return text.toString()
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");
}

/* NAVIGATION */

function goRegister(){
window.location.href="register.html";
}

function goLogin(){
window.location.href="login.html";
}

/* ASK BUTTON SECURITY */

function goToAsk(){

let user = getData("loggedInUser");

if(!user){

alert("Please login first");

window.location.href="login.html";

return;

}

if(user.banned){

alert("Your account is banned");

window.location.href="login.html";

return;

}

window.location.href="ask.html";

}

</script>

</body>
</html>
