<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AskExpert Admin Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{

background:
linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
url("https://images.unsplash.com/photo-1551434678-e076c223a692");

background-size:cover;

padding:30px;

}

.container{

max-width:1100px;

margin:auto;

background:white;

padding:35px;

border-radius:15px;

box-shadow:0 20px 40px rgba(0,0,0,.4);

}

h1{

text-align:center;

margin-bottom:20px;

}

.section{

margin-top:30px;

}

.card{

background:#f5f7ff;

padding:15px;

border-radius:10px;

margin-bottom:12px;

box-shadow:0 5px 12px rgba(0,0,0,.1);

}

button{

padding:6px 12px;

border:none;

border-radius:6px;

margin:3px;

cursor:pointer;

}

.delete{

background:#e53935;

color:white;

}

.ban{

background:#fb8c00;

color:white;

}

.view{

background:#3f51b5;

color:white;

}

.chat{

background:#2ecc71;

color:white;

}

</style>

</head>

<body onload="initAdmin()">

<div class="container">

<h1>AskExpert Admin Dashboard</h1>

<div class="section">

<h2>Registered Users</h2>

<div id="usersList"></div>

</div>

<div class="section">

<h2>Questions</h2>

<div id="questionsList"></div>

</div>

<div class="section">

<h2>Chats</h2>

<div id="chatList"></div>

</div>

<div class="section">

<h2>Documents</h2>

<div id="docsList"></div>

</div>

</div>

<script>

/* SAFE DATA */

function getData(key){

try{

return JSON.parse(localStorage.getItem(key)) || [];

}catch(e){

return [];

}

}

/* XSS SAFE */

function safe(text){

if(!text) return "";

return text.toString()

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;");

}

/* ADMIN INIT */

function initAdmin(){

let user=JSON.parse(localStorage.getItem("loggedInUser"));

if(!user || user.role!=="admin"){

alert("Admin access only");

window.location.href="login.html";

return;

}

loadUsers();

loadQuestions();

loadChats();

loadDocs();

}

/* USERS */

function loadUsers(){

let users=getData("users");

let container=document.getElementById("usersList");

container.innerHTML="";

users.forEach((u,i)=>{

let div=document.createElement("div");

div.className="card";

div.innerHTML=`

<b>${safe(u.name)}</b> (${safe(u.email)})

<br>

Role: ${safe(u.role || "user")}

<br>

<button class="ban" onclick="banUser(${i})">Ban</button>

<button class="delete" onclick="deleteUser(${i})">Delete</button>

`;

container.appendChild(div);

});

}

/* BAN USER */

function banUser(i){

let users=getData("users");

users[i].banned=true;

localStorage.setItem("users",JSON.stringify(users));

alert("User banned");

loadUsers();

}

/* DELETE USER */

function deleteUser(i){

if(!confirm("Delete user?")) return;

let users=getData("users");

users.splice(i,1);

localStorage.setItem("users",JSON.stringify(users));

loadUsers();

}

/* QUESTIONS */

function loadQuestions(){

let questions=getData("questions");

let container=document.getElementById("questionsList");

container.innerHTML="";

questions.forEach(q=>{

let div=document.createElement("div");

div.className="card";

div.innerHTML=`

<b>Question:</b> ${safe(q.question)}

<br>

Expert: ${safe(q.profession)}

<br>

Answer: ${safe(q.answer)}

`;

container.appendChild(div);

});

}

/* CHAT */

function loadChats(){

let container=document.getElementById("chatList");

container.innerHTML="";

for(let key in localStorage){

if(key.startsWith("chat_")){

let chats=JSON.parse(localStorage.getItem(key));

chats.forEach(c=>{

let div=document.createElement("div");

div.className="card";

div.innerHTML=`

<b>${safe(c.sender)}</b>: ${safe(c.text)}

<br>

${safe(c.time)}

`;

container.appendChild(div);

});

}

}

}

/* DOCUMENTS */

function loadDocs(){

let docs=getData("documents");

let container=document.getElementById("docsList");

container.innerHTML="";

docs.forEach(d=>{

let div=document.createElement("div");

div.className="card";

div.innerHTML=`

<b>${safe(d.name)}</b>

<br>

Profession: ${safe(d.profession)}

<br>

<a href="${d.file}" target="_blank">View Document</a>

`;

container.appendChild(div);

});

}

</script>

</body>
</html>
