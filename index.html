<!DOCTYPE html>
<html>
<head>

<title>AskExpert Platform</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
font-family:Arial, sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
}

.container{
text-align:center;
background:white;
padding:50px;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,0.2);
animation:fadeIn 1s;
}

.title{
font-size:42px;
color:#333;
margin-bottom:10px;
}

.subtitle{
font-size:18px;
color:#555;
margin-bottom:30px;
}

.buttons{
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
}

.btn{
text-decoration:none;
padding:14px 28px;
border-radius:25px;
font-size:18px;
color:white;
transition:0.3s;
}

.register{
background:#28a745;
}

.register:hover{
background:#1e7e34;
transform:scale(1.1);
}

.login{
background:#007bff;
}

.login:hover{
background:#0056b3;
transform:scale(1.1);
}

.ask{
background:#ff9800;
}

.ask:hover{
background:#e68900;
transform:scale(1.1);
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(-30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<div class="container">

<h1 class="title">AskExpert</h1>

<p class="subtitle">
Ask questions from verified professionals like Lawyers, Doctors, Teachers and Engineers.
</p>

<div class="buttons">

<a href="register.html" class="btn register">Register</a>

<a href="login.html" class="btn login">Login</a>

<a href="ask.html" class="btn ask">Ask Question</a>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
