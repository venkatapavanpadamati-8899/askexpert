<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AskExpert Platform</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* GLOBAL */

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Segoe UI',Arial,sans-serif;
}

/* BODY */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;

/* CHANGE BACKGROUND IMAGE HERE */

background:
linear-gradient(rgba(0,0,0,0.12),rgba(0,0,0,0.18)),
url("https://images.unsplash.com/photo-1557804506-669a67965ba0?q=80&w=1600");

background-size:cover;
background-position:center;
}

/* CARD */

.container{

text-align:center;

background:rgba(255,255,255,0.22);

backdrop-filter:blur(14px);

padding:60px;

border-radius:25px;

box-shadow:0 25px 60px rgba(0,0,0,0.35);

color:white;

max-width:520px;

width:90%;

transition:0.4s;

}

/* CARD HOVER */

.container:hover{

transform:scale(1.03);

box-shadow:0 35px 80px rgba(0,0,0,0.45);

}

/* TITLE */

.title{

font-size:42px;

font-weight:700;

margin-bottom:10px;

}

.title span{

color:#ffd54f;

}

/* SUBTITLE */

.subtitle{

font-size:18px;

opacity:.9;

margin-bottom:35px;

line-height:1.4;

}

/* ICONS */

.experts{

display:flex;

justify-content:center;

gap:20px;

margin-bottom:30px;

font-size:28px;

}

.experts i{

background:rgba(255,255,255,0.3);

padding:14px;

border-radius:50%;

transition:0.3s;

}

/* ICON HOVER */

.experts i:hover{

transform:scale(1.15);

background:rgba(255,255,255,0.6);

color:#333;

}

/* BUTTONS */

.buttons{

display:flex;

gap:15px;

justify-content:center;

flex-wrap:wrap;

}

/* BUTTON */

button{

padding:14px 30px;

border-radius:30px;

font-size:18px;

color:white;

border:none;

cursor:pointer;

display:flex;

align-items:center;

gap:8px;

box-shadow:0 8px 20px rgba(0,0,0,0.25);

transition:0.3s;

}

/* REGISTER */

.register{

background:linear-gradient(45deg,#28a745,#43d66c);

}

/* LOGIN */

.login{

background:linear-gradient(45deg,#007bff,#00c6ff);

}

/* HOVER */

button:hover{

transform:scale(1.08);

filter:brightness(1.1);

}

/* MOBILE */

@media(max-width:500px){

.container{
padding:40px 25px;
}

.title{
font-size:32px;
}

.subtitle{
font-size:16px;
}

}

</style>

</head>

<body>

<div class="container">

<h1 class="title">Ask<span>Expert</span></h1>

<p class="subtitle">
Ask questions from verified professionals like Lawyers, Doctors, Teachers, and Engineers.
</p>

<div class="experts">

<i class="fa-solid fa-user-doctor"></i>

<i class="fa-solid fa-scale-balanced"></i>

<i class="fa-solid fa-laptop-code"></i>

<i class="fa-solid fa-graduation-cap"></i>

</div>

<div class="buttons">

<button class="register" onclick="goRegister()">
<i class="fa-solid fa-user-plus"></i> Register
</button>

<button class="login" onclick="goLogin()">
<i class="fa-solid fa-right-to-bracket"></i> Login
</button>

</div>

</div>

<script>

function goRegister(){

window.location.href="register.html";

}

function goLogin(){

window.location.href="login.html";

}

</script>

</body>

</html>
