<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AskExpert Platform</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* GLOBAL */

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Segoe UI',Arial,sans-serif;
}

/* BODY BACKGROUND */

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

/* CLEAR IMAGE */

background-image:
linear-gradient(rgba(0,0,0,0.15),rgba(0,0,0,0.2)),
url("https://images.unsplash.com/photo-1556157382-97eda2d62296?w=1600");

background-size:cover;
background-position:center;
background-attachment:fixed;

}

/* CARD */

.container{

text-align:center;

background:rgba(255,255,255,0.25);

backdrop-filter:blur(12px);

padding:60px;

border-radius:25px;

box-shadow:0 25px 60px rgba(0,0,0,0.35);

color:white;

max-width:520px;

width:90%;

transition:0.4s;

}

/* HOVER EFFECT */

.container:hover{

transform:scale(1.03);

box-shadow:0 35px 70px rgba(0,0,0,0.45);

}

/* TITLE */

.title{

font-size:42px;

font-weight:700;

margin-bottom:10px;

}

.title span{

color:#ffd54f;

}

/* SUBTITLE */

.subtitle{

font-size:18px;

opacity:.95;

margin-bottom:35px;

line-height:1.4;

}

/* ICONS */

.experts{

display:flex;

justify-content:center;

gap:20px;

margin-bottom:30px;

font-size:28px;

}

.experts i{

background:rgba(255,255,255,0.35);

padding:14px;

border-radius:50%;

transition:0.3s;

}

.experts i:hover{

transform:scale(1.2);

background:white;

color:#333;

}

/* BUTTON AREA */

.buttons{

display:flex;

gap:15px;

justify-content:center;

flex-wrap:wrap;

}

/* BUTTON STYLE */

button{

padding:14px 30px;

border-radius:30px;

font-size:18px;

color:white;

border:none;

cursor:pointer;

display:flex;

align-items:center;

gap:8px;

box-shadow:0 10px 25px rgba(0,0,0,0.35);

transition:0.3s;

}

/* REGISTER */

.register{

background:linear-gradient(45deg,#28a745,#3ddc84);

}

/* LOGIN */

.login{

background:linear-gradient(45deg,#007bff,#00c6ff);

}

/* BUTTON HOVER */

button:hover{

transform:scale(1.1);

filter:brightness(1.1);

}

/* MOBILE */

@media(max-width:500px){

.title{
font-size:32px;
}

.subtitle{
font-size:15px;
}

}

</style>

</head>

<body>

<div class="container">

<h1 class="title">Ask<span>Expert</span></h1>

<p class="subtitle">
Ask questions from verified professionals like Lawyers, Doctors, Teachers, and Engineers.
</p>

<div class="experts">

<i class="fa-solid fa-user-doctor"></i>

<i class="fa-solid fa-scale-balanced"></i>

<i class="fa-solid fa-laptop-code"></i>

<i class="fa-solid fa-graduation-cap"></i>

</div>

<div class="buttons">

<button class="register" onclick="goRegister()">

<i class="fa-solid fa-user-plus"></i>
Register

</button>

<button class="login" onclick="goLogin()">

<i class="fa-solid fa-right-to-bracket"></i>
Login

</button>

</div>

</div>

<script>

/* REGISTER PAGE */

function goRegister(){

window.location.href="register.html";

}

/* LOGIN PAGE */

function goLogin(){

window.location.href="login.html";

}

</script>

</body>
</html>
