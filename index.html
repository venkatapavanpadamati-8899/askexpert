<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AskExpert Platform</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* GLOBAL */
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Segoe UI',Arial,sans-serif;
}

/* BODY */
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.55)),
url("https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=1600")
center/cover no-repeat;

animation:bgPulse 12s ease-in-out infinite alternate;
}

@keyframes bgPulse{
0%{filter:brightness(1);}
50%{filter:brightness(1.15);}
100%{filter:brightness(1);}
}

/* CARD */
.container{
text-align:center;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(18px);
padding:60px;
border-radius:25px;
box-shadow:0 25px 60px rgba(0,0,0,0.45);
color:white;
max-width:520px;
transition:0.4s;
}

.container:hover{
box-shadow:0 35px 80px rgba(0,0,0,0.6);
transform:scale(1.02);
}

/* TITLE */
.title{
font-size:42px;
font-weight:700;
margin-bottom:10px;
}

.title span{
color:#ffd54f;
}

.subtitle{
font-size:18px;
opacity:.9;
margin-bottom:35px;
}

/* ICONS */
.experts{
display:flex;
justify-content:center;
gap:20px;
margin-bottom:30px;
font-size:28px;
}

.experts i{
background:rgba(255,255,255,0.2);
padding:12px;
border-radius:50%;
transition:.3s;
}

.experts i:hover{
background:rgba(255,255,255,0.4);
transform:scale(1.2);
}

/* BUTTONS */
.buttons{
display:flex;
gap:12px;
justify-content:center;
flex-wrap:wrap;
}

button{
padding:14px 28px;
border-radius:30px;
font-size:18px;
color:white;
border:none;
cursor:pointer;
transition:.3s;
display:flex;
align-items:center;
gap:8px;
box-shadow:0 8px 20px rgba(0,0,0,0.35);
}

.register{background:#28a745;}
.login{background:#007bff;}
.ask{background:#ff9800;}

button:hover{
transform:scale(1.08);
filter:brightness(1.1);
}

</style>
</head>

<body>

<div class="container">

<h1 class="title">Ask<span>Expert</span></h1>

<p class="subtitle">
Ask questions from verified professionals like Lawyers, Doctors, Teachers, and Engineers.
</p>

<div class="experts">
<i class="fa-solid fa-user-doctor"></i>
<i class="fa-solid fa-scale-balanced"></i>
<i class="fa-solid fa-laptop-code"></i>
<i class="fa-solid fa-graduation-cap"></i>
</div>

<div class="buttons">

<button class="register" onclick="goRegister()">
<i class="fa-solid fa-user-plus"></i> Register
</button>

<button class="login" onclick="goLogin()">
<i class="fa-solid fa-right-to-bracket"></i> Login
</button>

<button class="ask" onclick="goToAsk()">
<i class="fa-solid fa-question"></i> Ask Question
</button>

</div>

</div>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {

apiKey: "YOUR_REAL_FIREBASE_KEY",
authDomain: "askexpert-b642b.firebaseapp.com",
projectId: "askexpert-b642b",
storageBucket: "askexpert-b642b.appspot.com",
messagingSenderId: "407440869696",
appId: "1:407440869696:web:504234dd881a7e875dd2a5"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

console.log("Firebase connected");

/* LOGIN CHECK */

function getUser(){

try{
return JSON.parse(localStorage.getItem("loggedInUser"));
}catch{
return null;
}

}

function goRegister(){
window.location.href="register.html";
}

function goLogin(){
window.location.href="login.html";
}

function goToAsk(){

let user=getUser();

if(!user){
alert("Please login first");
window.location.href="login.html";
return;
}

window.location.href="ask.html";

}

</script>

</body>
</html>
