<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AskExpert Platform</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* GLOBAL */

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Segoe UI',Arial,sans-serif;
}

/* BODY */

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background-image:url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=1600");

background-size:cover;
background-position:center;

}

/* CARD */

.container{

text-align:center;

background:rgba(255,255,255,0.85);

padding:45px;

border-radius:25px;

box-shadow:0 25px 60px rgba(0,0,0,0.35);

color:#333;

max-width:420px;

width:90%;

}

/* TITLE */

.title{

font-size:38px;

font-weight:700;

margin-bottom:10px;

}

.title span{

color:#ffb300;

}

/* SUBTITLE */

.subtitle{

font-size:16px;

margin-bottom:30px;

line-height:1.4;

}

/* ICONS */

.experts{

display:flex;

justify-content:center;

gap:20px;

margin-bottom:30px;

font-size:26px;

}

.experts i{

background:#f2f2f2;

padding:14px;

border-radius:50%;

transition:.3s;

}

.experts i:hover{

transform:scale(1.2);

background:#ffb300;

color:white;

}

/* BUTTON AREA */

.buttons{

display:flex;

flex-direction:column;

gap:15px;

}

/* BUTTON */

button{

padding:15px;

border-radius:30px;

font-size:18px;

border:none;

cursor:pointer;

display:flex;

align-items:center;

justify-content:center;

gap:10px;

color:white;

box-shadow:0 8px 20px rgba(0,0,0,0.25);

transition:.3s;

}

/* REGISTER */

.register{

background:linear-gradient(45deg,#28a745,#4cd964);

}

/* LOGIN */

.login{

background:linear-gradient(45deg,#007bff,#00c6ff);

}

/* HOVER */

button:hover{

transform:scale(1.07);

}

/* MOBILE */

@media(max-width:500px){

.container{
padding:35px;
}

.title{
font-size:32px;
}

.subtitle{
font-size:14px;
}

}

</style>

</head>

<body>

<div class="container">

<h1 class="title">Ask<span>Expert</span></h1>

<p class="subtitle">
Ask questions from verified professionals like Lawyers, Doctors, Teachers and Engineers.
</p>

<div class="experts">

<i class="fa-solid fa-user-doctor"></i>

<i class="fa-solid fa-scale-balanced"></i>

<i class="fa-solid fa-laptop-code"></i>

<i class="fa-solid fa-graduation-cap"></i>

</div>

<div class="buttons">

<button class="register" onclick="goRegister()">

<i class="fa-solid fa-user-plus"></i>
Register

</button>

<button class="login" onclick="goLogin()">

<i class="fa-solid fa-right-to-bracket"></i>
Login

</button>

</div>

</div>

<script>

function goRegister(){

window.location.href="register.html";

}

function goLogin(){

window.location.href="login.html";

}

</script>

</body>
</html>
