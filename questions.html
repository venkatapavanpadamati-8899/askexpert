<!DOCTYPE html>
<html>
<head>
<title>Questions - AskExpert</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f4f4;
padding:40px;
}

h2{
text-align:center;
}

.question-box{
background:white;
padding:20px;
margin:20px auto;
max-width:600px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

textarea{
width:100%;
height:80px;
margin-top:10px;
padding:10px;
border-radius:5px;
border:1px solid #ccc;
}

button{
margin-top:10px;
padding:10px 15px;
background:#28a745;
border:none;
color:white;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#218838;
}

</style>

</head>

<body>

<h2>User Questions</h2>

<div id="questionsList"></div>

<script>

let questions = JSON.parse(localStorage.getItem("questions")) || [];

let container = document.getElementById("questionsList");

questions.forEach(function(q,index){

let div = document.createElement("div");

div.className="question-box";

div.innerHTML = `
<p><b>Question:</b> ${q.question}</p>
<p><b>Expert Needed:</b> ${q.expert}</p>

<textarea placeholder="Write your answer"></textarea>

<button onclick="submitAnswer(${index})">Submit Answer</button>

<hr>
`;

container.appendChild(div);

});

function submitAnswer(index){

alert("Answer submitted successfully!");

}

</script>

</body>
</html>
