<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Questions - AskExpert</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Arial;
}

/* BACKGROUND */

body{
min-height:100vh;

background:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.7)),
url("https://images.unsplash.com/photo-1521791136064-7986c2920216");

background-size:cover;
background-position:center;

padding:40px;
}

/* CONTAINER */

.container{
max-width:900px;
margin:auto;

background:rgba(255,255,255,0.95);

padding:35px;

border-radius:18px;

box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

/* HEADER */

.header{
text-align:center;
margin-bottom:25px;
}

.header img{
width:70px;
margin-bottom:10px;
}

h2{
margin-bottom:10px;
}

/* CHAT BUTTON */

.chat-link{
display:inline-block;
padding:10px 20px;
background:#4c6ef5;
color:white;
text-decoration:none;
border-radius:6px;
font-weight:bold;
}

.chat-link:hover{
background:#364fc7;
}

/* QUESTION CARD */

.question-box{
background:white;
padding:20px;
margin:20px 0;
border-radius:12px;
box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

/* ANSWER */

.answer{
margin-top:10px;
padding:10px;
background:#f4f6ff;
border-radius:6px;
}

/* TEXTAREA */

textarea{
width:100%;
height:90px;
margin-top:10px;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
resize:none;
}

/* BUTTON */

button{
margin-top:10px;
padding:10px 15px;
background:#2ecc71;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#27ae60;
}

/* RATING */

.rating{
margin-top:10px;
}

.rating button{
background:#ffc107;
color:black;
margin:3px;
}

/* TIMESTAMP */

.timestamp{
font-size:12px;
color:gray;
margin-top:5px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<h2>User Questions</h2>

<a href="chat.html" class="chat-link">💬 Open Chat</a>

</div>

<div id="questionsList"></div>

</div>

<script>

/* SAFE JSON */

function getData(key){
try{
return JSON.parse(localStorage.getItem(key));
}catch(e){
return null;
}
}

/* SAFE ARRAY */

function getArray(key){
let data = getData(key);
return Array.isArray(data) ? data : [];
}

/* SAFE OBJECT */

function getObject(key){
let data = getData(key);
return (data && typeof data==="object") ? data : {};
}

/* FULL XSS PROTECTION */

function safe(text){
if(!text) return "";
return text.toString()
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#39;");
}

/* LOGIN CHECK */

window.onload=function(){

let user = getData("loggedInUser");

if(!user){
alert("Please login first");
window.location.href="login.html";
return;
}

if(user.banned){
alert("Your account is banned");
window.location.href="login.html";
return;
}

loadQuestions();

}

/* LOAD QUESTIONS */

function loadQuestions(){

let questions = getArray("questions");

let container = document.getElementById("questionsList");

container.innerHTML="";

if(questions.length===0){

container.innerHTML="<p style='text-align:center'>No questions yet.</p>";

return;

}

questions.forEach(q=>{

let div=document.createElement("div");

div.className="question-box";

let questionText = safe(q.question);
let profession = safe(q.profession);
let notes = safe(q.notes);
let timestamp = safe(q.timestamp || "N/A");
let answer = safe(q.answer || "No answer yet");

div.innerHTML=`

<p><b>Question:</b> ${questionText}</p>

<p><b>Expert Needed:</b> ${profession}</p>

${q.notes ? `<p><b>Notes:</b> ${notes}</p>` : ""}

<p class="timestamp"><b>Asked on:</b> ${timestamp}</p>

<div class="answer"><b>Answer:</b> ${answer}</div>

<textarea id="answer_${q.id}" placeholder="Write your answer..."></textarea>

<button onclick="submitAnswer(${Number(q.id)})">Submit Answer</button>

<div class="rating">

<p><b>Rate this expert:</b></p>

<button onclick="rateExpert('${q.profession}',5)">⭐5</button>
<button onclick="rateExpert('${q.profession}',4)">⭐4</button>
<button onclick="rateExpert('${q.profession}',3)">⭐3</button>
<button onclick="rateExpert('${q.profession}',2)">⭐2</button>
<button onclick="rateExpert('${q.profession}',1)">⭐1</button>

</div>

`;

container.appendChild(div);

/* ENTER KEY SUBMIT */

let textarea=document.getElementById("answer_"+q.id);

textarea.addEventListener("keypress",function(e){
if(e.key==="Enter" && !e.shiftKey){
e.preventDefault();
submitAnswer(q.id);
}
});

});

}

/* SUBMIT ANSWER */

function submitAnswer(id){

let questions=getArray("questions");

let text=document.getElementById("answer_"+id).value.trim();

if(text===""){
alert("Please write an answer first");
return;
}

let index=questions.findIndex(q=>Number(q.id)===Number(id));

if(index===-1){
alert("Question not found");
return;
}

/* sanitize answer before saving */

questions[index].answer=safe(text);

localStorage.setItem("questions",JSON.stringify(questions));

alert("Answer submitted successfully!");

loadQuestions();

}

/* RATE EXPERT */

function rateExpert(expert,stars){

let ratings=getObject("expertRatings");

/* prevent rating spam */

let rated = localStorage.getItem("rated_"+expert);

if(rated){
alert("You already rated this expert");
return;
}

if(!ratings[expert]){
ratings[expert]={total:0,count:0};
}

ratings[expert].total += stars;
ratings[expert].count += 1;

localStorage.setItem("expertRatings",JSON.stringify(ratings));

localStorage.setItem("rated_"+expert,true);

let avg = ratings[expert].count
? (ratings[expert].total/ratings[expert].count).toFixed(1)
: "0";

alert("Thanks! "+expert+" rating: ⭐ "+avg);

}

</script>

</body>
</html>
