<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Role - AskExpert</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, Arial;
}

body{
min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.7)),
url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f");

background-size:cover;
background-position:center;
}

/* CARD */

.container{

width:90%;
max-width:500px;

background:white;

padding:40px;

border-radius:20px;

box-shadow:0 20px 40px rgba(0,0,0,0.3);

text-align:center;

}

/* TITLE */

h2{
margin-bottom:10px;
color:#333;
}

p{
color:#666;
margin-bottom:20px;
}

/* ROLE BUTTONS */

.role-box{

display:flex;
flex-direction:column;
gap:15px;

}

button{

padding:15px;

font-size:16px;

border:none;

border-radius:10px;

cursor:pointer;

color:white;

transition:0.3s;

}

/* USER */

.user{
background:#4CAF50;
}

.user:hover{
background:#3d8b40;
}

/* EXPERT */

.expert{
background:#2196F3;
}

.expert:hover{
background:#1976d2;
}

/* ADMIN */

.admin{
background:#FF9800;
}

.admin:hover{
background:#e68900;
}

/* BACK */

.back{
display:block;
margin-top:20px;
text-decoration:none;
color:#555;
}

</style>
</head>

<body>

<div class="container">

<h2>Select Your Role</h2>

<p>Choose how you want to use AskExpert</p>

<div class="role-box">

<button class="user" onclick="setRole('user')">
👤 Continue as User
</button>

<button class="expert" onclick="setRole('expert')">
🎓 Continue as Expert
</button>

<button class="admin" onclick="setRole('admin')">
🛠 Continue as Admin
</button>

</div>

<a href="index.html" class="back">⬅ Back</a>

</div>

<script>

/* SAFE JSON */

function getData(key){

try{
return JSON.parse(localStorage.getItem(key));
}catch{
return null;
}

}

/* SET ROLE */

function setRole(role){

let user =
getData("loggedInUser") ||
getData("user");

if(!user){

alert("Please login first");

window.location.href="login.html";

return;

}

/* UPDATE ROLE */

user.role = role;

/* SAVE USER */

localStorage.setItem("loggedInUser",JSON.stringify(user));
localStorage.setItem("user",JSON.stringify(user));

/* REDIRECT */

if(role==="user"){

window.location.href="ask.html";

}

else if(role==="expert"){

/* FIXED PAGE NAME */

window.location.href="professional.html";

}

else if(role==="admin"){

window.location.href="admin.html";

}

}

</script>

</body>
</html>
