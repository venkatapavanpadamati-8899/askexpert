<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AskExpert Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Segoe UI,sans-serif;
}

body{

background:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f");

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

}

.chat-container{

width:460px;
height:720px;

display:flex;
flex-direction:column;

background:rgba(255,255,255,0.15);
backdrop-filter:blur(18px);

border-radius:20px;

overflow:hidden;

box-shadow:0 20px 60px rgba(0,0,0,0.4);

}

.chat-header{

background:linear-gradient(90deg,#2563eb,#4f46e5);

color:white;

padding:15px;

font-weight:bold;

display:flex;
justify-content:space-between;
align-items:center;

}

.chat-messages{

flex:1;

padding:20px;

overflow-y:auto;

display:flex;
flex-direction:column;

gap:12px;

}

.message{

max-width:80%;

padding:10px 15px;

border-radius:18px;

font-size:14px;

word-break:break-word;

}

.message.user{

align-self:flex-end;

background:linear-gradient(135deg,#34d399,#10b981);

color:white;

}

.message.expert{

align-self:flex-start;

background:linear-gradient(135deg,#fda4af,#fb7185);

color:white;

}

.time{

font-size:11px;

opacity:0.7;

margin-top:4px;

}

.chat-input{

display:flex;

padding:10px;

background:rgba(255,255,255,0.1);

}

.chat-input input{

flex:1;

padding:10px;

border-radius:20px;

border:none;

outline:none;

}

.chat-input button{

margin-left:6px;

border:none;

background:#2563eb;

color:white;

padding:10px 15px;

border-radius:20px;

cursor:pointer;

}

.clear-btn{

background:#ef4444;

}

.file-preview{

max-width:200px;

border-radius:8px;

margin-top:5px;

}

#fileUpload{

display:none;

}

.lang-select{

margin:6px;
border-radius:6px;
padding:4px;

}

</style>

</head>

<body>

<div class="chat-container">

<div class="chat-header">

<span>AskExpert Chat</span>

<button class="clear-btn" onclick="clearChat()">Clear</button>

</div>

<div id="chatMessages" class="chat-messages"></div>

<div style="padding:5px;text-align:center">

<select id="language" class="lang-select">

<option value="en-IN">English</option>
<option value="te-IN">Telugu</option>

</select>

</div>

<div class="chat-input">

<input id="messageInput" type="text" placeholder="Type message...">

<button onclick="sendMessage()">Send</button>

<button onclick="startMic()">🎤</button>

<button onclick="document.getElementById('fileUpload').click()">📎</button>

<input type="file" id="fileUpload" onchange="sendFile()">

</div>

</div>

<script>

/* LOGIN CHECK */

let user = JSON.parse(localStorage.getItem("loggedInUser"))
        || JSON.parse(localStorage.getItem("user"));

if(!user){

alert("Please login");

window.location.href="login.html";

}

/* STORAGE */

function getChat(){

let key="chat_"+user.email;

return JSON.parse(localStorage.getItem(key)) || [];

}

function saveChat(data){

let key="chat_"+user.email;

localStorage.setItem(key,JSON.stringify(data));

}

/* XSS SAFE */

function safe(text){

if(!text) return "";

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* LOAD CHAT */

function loadChat(){

let messages=getChat();

let chatBox=document.getElementById("chatMessages");

chatBox.innerHTML="";

messages.slice(-200).forEach(m=>{

let div=document.createElement("div");

div.className="message "+m.sender;

let content=document.createElement("div");

content.innerHTML=safe(m.text);

if(m.file){

if(m.fileType.startsWith("image")){

let img=document.createElement("img");

img.src=m.file;

img.className="file-preview";

content.appendChild(img);

}

else{

let link=document.createElement("a");

link.href=m.file;

link.innerText="Download file";

link.target="_blank";

content.appendChild(link);

}

}

let time=document.createElement("div");

time.className="time";

time.innerText=m.time;

content.appendChild(time);

div.appendChild(content);

chatBox.appendChild(div);

});

setTimeout(()=>{

chatBox.scrollTop=chatBox.scrollHeight;

},50);

}

/* SPELL CORRECTION */

function correctText(text){

return text
.replace(/plese/gi,"please")
.replace(/becuse/gi,"because")
.replace(/teh/gi,"the");

}

/* SEND MESSAGE */

function sendMessage(){

let input=document.getElementById("messageInput");

let msg=input.value.trim();

if(msg.length<1) return;

msg=correctText(msg);

let messages=getChat();

messages.push({

text:msg,
sender:"user",
time:new Date().toLocaleTimeString()

});

saveChat(messages);

input.value="";

loadChat();

showTyping(msg);

}

/* TYPING */

function showTyping(userMsg){

let chatBox=document.getElementById("chatMessages");

let typing=document.createElement("div");

typing.className="message expert";

typing.innerText="Expert typing...";

chatBox.appendChild(typing);

chatBox.scrollTop=chatBox.scrollHeight;

setTimeout(()=>{

typing.remove();

expertReply(userMsg);

},1500);

}

/* EXPERT AI REPLY */

function expertReply(text){

let reply="Please explain your problem more clearly.";

text=text.toLowerCase();

if(text.includes("laptop") || text.includes("computer"))
reply="Check battery, charger or restart your laptop.";

else if(text.includes("fever") || text.includes("health"))
reply="You should consult a doctor and take rest.";

else if(text.includes("law") || text.includes("court"))
reply="Please provide legal details so a lawyer can help.";

let messages=getChat();

messages.push({

text:reply,
sender:"expert",
time:new Date().toLocaleTimeString()

});

saveChat(messages);

loadChat();

}

/* FILE SEND */

function sendFile(){

let file=document.getElementById("fileUpload").files[0];

if(!file) return;

if(file.size>5000000){

alert("Max file size 5MB");

return;

}

let allowed=[
"image/",
"application/pdf",
"application/msword",
"application/vnd.openxmlformats-officedocument.wordprocessingml.document"
];

if(!allowed.some(type=>file.type.startsWith(type))){

alert("File type not allowed");

return;

}

let reader=new FileReader();

reader.onload=function(e){

let messages=getChat();

messages.push({

text:"File shared",
file:e.target.result,
fileType:file.type,
sender:"user",
time:new Date().toLocaleTimeString()

});

saveChat(messages);

loadChat();

}

reader.readAsDataURL(file);

}

/* VOICE INPUT */

function startMic(){

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert("Voice not supported");

return;

}

const recognition=new SpeechRecognition();

recognition.lang=document.getElementById("language").value;

recognition.start();

recognition.onresult=(event)=>{

let text=event.results[0][0].transcript;

document.getElementById("messageInput").value=text;

};

}

/* ENTER KEY */

document.getElementById("messageInput").addEventListener("keypress",function(e){

if(e.key==="Enter") sendMessage();

});

/* CLEAR CHAT */

function clearChat(){

if(confirm("Clear chat?")){

localStorage.removeItem("chat_"+user.email);

loadChat();

}

}

loadChat();

</script>

</body>
</html>
