<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ask Question - AskExpert</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Segoe UI,Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.ask-box{
background:white;
padding:40px;
width:480px;
border-radius:18px;
box-shadow:0 20px 50px rgba(0,0,0,.25);
animation:fadeIn .7s;
}

h2{text-align:center;margin-bottom:20px;}

textarea,select,input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:15px;
font-size:14px;
}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
font-size:15px;
cursor:pointer;
margin-top:10px;
}

.voice-btn{background:#ff5722;color:white;}
.ai-btn{background:#8e24aa;color:white;}
.submit-btn{background:#28a745;color:white;}

button:hover{opacity:.9;}

#errorMsg{
text-align:center;
margin-bottom:12px;
font-weight:bold;
}

.home-link{
text-align:center;
margin-top:15px;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(-20px);}
to{opacity:1;transform:translateY(0);}
}

</style>

<script>

/* -------------------------
SAFE JSON FUNCTION
------------------------- */

function getData(key){
try{
let data = JSON.parse(localStorage.getItem(key));
return data ? data : null;
}catch(e){
return null;
}
}

/* -------------------------
XSS SECURITY
------------------------- */

function safe(text){
if(!text) return "";
return text.toString()
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");
}

/* -------------------------
LOGIN CHECK
------------------------- */

let user = getData("loggedInUser");

if(!user){
alert("Please login first");
window.location.href="login.html";
}

if(user && user.banned){
alert("Your account is banned");
window.location.href="login.html";
}

/* -------------------------
SPAM DETECTION
------------------------- */

function detectSpam(text){

text=text.toLowerCase();

if(text.includes("test") || text.includes("asdf")) return true;

if(/(.)\1{5,}/.test(text)) return true;

return false;

}

/* -------------------------
SUBMIT QUESTION
------------------------- */

function submitQuestion(){

let question=document.getElementById("question").value.trim();
let profession=document.getElementById("professionSelect").value;
let notes=document.getElementById("notes").value.trim();
let language=document.getElementById("language").value;

let error=document.getElementById("errorMsg");

if(question===""){
error.innerText="Please write your question";
error.style.color="red";
return;
}

if(question.length < 10){
error.innerText="Question must be at least 10 characters";
error.style.color="red";
return;
}

if(detectSpam(question)){
error.innerText="Spam or low quality question detected";
error.style.color="red";
return;
}

if(profession===""){
error.innerText="Please select expert";
error.style.color="red";
return;
}

let questions = getData("questions") || [];

let newQuestion={

id:Date.now(),

question:safe(question),

profession:profession,

notes:safe(notes),

askedBy:safe(user.name),

language:language,

timestamp:new Date().toLocaleString(),

answer:"",

status:"pending",

views:0

};

questions.push(newQuestion);

localStorage.setItem("questions",JSON.stringify(questions));

error.style.color="green";
error.innerText="Question submitted successfully!";

document.getElementById("question").value="";
document.getElementById("notes").value="";
document.getElementById("professionSelect").value="";

}

/* -------------------------
AI EXPERT DETECTION
------------------------- */

function identifyExpert(){

let text=document.getElementById("question").value.toLowerCase();

let profession="";

if(text.includes("fever") || text.includes("medicine") || text.includes("pain"))
profession="doctor";

else if(text.includes("court") || text.includes("law") || text.includes("case"))
profession="lawyer";

else if(text.includes("software") || text.includes("computer") || text.includes("coding") || text.includes("app"))
profession="engineer";

else if(text.includes("exam") || text.includes("study") || text.includes("homework"))
profession="teacher";

else if(text.includes("crime") || text.includes("complaint"))
profession="police";

document.getElementById("professionSelect").value=profession;

let error=document.getElementById("errorMsg");

if(profession===""){
error.innerText="AI could not detect expert";
error.style.color="orange";
}
else{
error.innerText="AI Suggests: "+profession;
error.style.color="blue";
}

}

/* -------------------------
VOICE INPUT
------------------------- */

function startVoice(){

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Voice recognition not supported");
return;
}

const recognition=new SpeechRecognition();

recognition.lang="en-US";

recognition.start();

recognition.onresult=function(event){

let voiceText=event.results[0][0].transcript;

document.getElementById("question").value=voiceText;

};

recognition.onend=function(){
console.log("Voice input finished");
};

}

</script>

</head>

<body>

<div class="ask-box">

<h2>Ask Your Question</h2>

<p id="errorMsg"></p>

<label>Select Language</label>

<select id="language">
<option value="English">English</option>
<option value="Telugu">Telugu</option>
</select>

<label>Describe your problem</label>

<textarea id="question" placeholder="Explain your problem..."></textarea>

<button class="voice-btn" onclick="startVoice()">🎤 Speak Question</button>

<button class="ai-btn" onclick="identifyExpert()">🤖 AI Identify Expert</button>

<label>Select Professional</label>

<select id="professionSelect">

<option value="">Select Profession</option>
<option value="doctor">Doctor</option>
<option value="lawyer">Lawyer</option>
<option value="engineer">Engineer</option>
<option value="teacher">Teacher</option>
<option value="police">Police</option>
<option value="business">Business Expert</option>
<option value="finance">Financial Expert</option>
<option value="marketing">Marketing Expert</option>
<option value="startup">Startup Mentor</option>
<option value="it">IT Support</option>
<option value="psychologist">Psychologist</option>
<option value="career">Career Advisor</option>

</select>

<label>Optional Notes</label>

<input type="text" id="notes" placeholder="Extra information">

<button class="submit-btn" onclick="submitQuestion()">Submit Question</button>

<div class="home-link">
<a href="index.html">Back to Home</a>
</div>

</div>

</body>
</html>
