<!DOCTYPE html>
<html>
<head>
<title>Ask Question - AskExpert</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.ask-box{
background:white;
padding:40px;
width:450px;
border-radius:15px;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
animation:fadeIn 1s;
}

h2{
text-align:center;
margin-bottom:20px;
}

textarea{
width:100%;
height:120px;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:15px;
resize:none;
}

select{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:15px;
}

button{
width:100%;
padding:12px;
background:#28a745;
border:none;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#218838;
}

.ai-btn{
background:#007bff;
}

.ai-btn:hover{
background:#0069d9;
}

.home-link{
text-align:center;
margin-top:15px;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(-30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

<script>

/* AI expert detection */

function detectExpert(){

let question = document.getElementById("question").value.toLowerCase();

if(question.trim()==""){
alert("Please write your problem first.");
return;
}

let expert = document.getElementById("expert");

if(question.includes("pain") || question.includes("fever") || question.includes("medicine")){
expert.value = "Doctor";
alert("AI Suggestion: You should ask a Doctor");
}

else if(question.includes("court") || question.includes("case") || question.includes("law")){
expert.value = "Lawyer";
alert("AI Suggestion: You should ask a Lawyer");
}

else if(question.includes("study") || question.includes("exam") || question.includes("homework")){
expert.value = "Teacher";
alert("AI Suggestion: You should ask a Teacher");
}

else if(question.includes("software") || question.includes("coding") || question.includes("app")){
expert.value = "Engineer";
alert("AI Suggestion: You should ask an Engineer");
}

else{
alert("AI could not identify. Please select expert manually.");
}

}


/* Save question */

function saveQuestion(){

let question = document.getElementById("question").value;
let expert = document.getElementById("expert").value;
let type = document.getElementById("type").value;

if(question=="" || expert==""){
alert("Please fill all fields.");
return false;
}

let data = {
question: question,
expert: expert,
type: type
};

let questions = JSON.parse(localStorage.getItem("questions")) || [];

questions.push(data);

localStorage.setItem("questions", JSON.stringify(questions));

alert("Question submitted successfully!");

window.location.href="questions.html";

return false;

}

</script>

</head>

<body>

<div class="ask-box">

<h2>Ask Your Question</h2>

<form onsubmit="return saveQuestion()">

<textarea id="question" placeholder="Describe your problem here..." required></textarea>

<button type="button" class="ai-btn" onclick="detectExpert()">AI Identify Expert</button>

<select id="expert">
<option value="">Select Professional</option>
<option value="Lawyer">Lawyer</option>
<option value="Doctor">Doctor</option>
<option value="Teacher">Teacher</option>
<option value="Engineer">Engineer</option>
<option value="Police">Police</option>
</select>

<select id="type">
<option value="">Question Type</option>
<option value="Public">Public Question</option>
<option value="Private">Private Question</option>
</select>

<button type="submit">Submit Question</button>

</form>

<div class="home-link">
<a href="index.html">Back to Home</a>
</div>

</div>

</body>
</html>
