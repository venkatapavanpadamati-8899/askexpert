<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ask Question - AskExpert</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Segoe UI,Arial;
}

/* Animated Background */

body{
background:linear-gradient(-45deg,#667eea,#764ba2,#6a11cb,#2575fc);
background-size:400% 400%;
animation:gradientMove 12s ease infinite;

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Glass Card */

.ask-box{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);

padding:40px;
width:500px;

border-radius:18px;
box-shadow:0 20px 50px rgba(0,0,0,.25);

animation:floatCard 6s ease-in-out infinite;

color:white;
}

@keyframes floatCard{
0%{transform:translateY(0);}
50%{transform:translateY(-8px);}
100%{transform:translateY(0);}
}

h2{
text-align:center;
margin-bottom:20px;
}

/* Inputs */

textarea,select,input{
width:100%;
padding:12px;
border-radius:8px;
border:none;
margin-bottom:15px;
font-size:14px;
}

textarea{
height:120px;
resize:none;
}

/* Buttons */

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
font-size:15px;
cursor:pointer;
margin-top:10px;
}

.voice-btn{background:#ff5722;color:white;}
.ai-btn{background:#8e24aa;color:white;}
.submit-btn{background:#28a745;color:white;}

button:hover{
opacity:.9;
}

/* Error message */

#errorMsg{
text-align:center;
margin-bottom:12px;
font-weight:bold;
}

/* Back link */

.home-link{
text-align:center;
margin-top:15px;
}

.home-link a{
color:white;
text-decoration:none;
}

</style>

<script>

/* SAFE JSON */

function getData(key){
try{
return JSON.parse(localStorage.getItem(key)) || null;
}catch(e){
return null;
}
}

/* XSS PROTECTION */

function safe(text){
if(!text) return "";
return text.toString()
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

/* LOGIN CHECK */

window.onload=function(){

let user=getData("loggedInUser");

if(!user){
alert("Please login first");
window.location.replace("login.html");
return;
}

if(user.banned){
alert("Your account is banned");
window.location.replace("login.html");
}

}

/* SPAM DETECTION */

function detectSpam(text){

text=text.toLowerCase();

if(
text.includes("test") ||
text.includes("asdf") ||
text.includes("qwerty") ||
text.includes("dummy")
) return true;

if(/(.)\1{5,}/.test(text)) return true;

return false;

}

/* SUBMIT QUESTION */

function submitQuestion(){

let user=getData("loggedInUser");

let question=document.getElementById("question").value.trim();
let profession=document.getElementById("professionSelect").value;
let notes=document.getElementById("notes").value.trim();
let language=document.getElementById("language").value;

let error=document.getElementById("errorMsg");

if(question===""){
error.innerText="Please write your question";
error.style.color="red";
return;
}

if(question.length<10){
error.innerText="Question must be at least 10 characters";
error.style.color="red";
return;
}

if(detectSpam(question)){
error.innerText="Spam or low quality question detected";
error.style.color="red";
return;
}

if(profession===""){
error.innerText="Please select expert";
error.style.color="red";
return;
}

let questions=getData("questions") || [];

let newQuestion={

id:Date.now(),

question:safe(question),

profession:profession,

notes:safe(notes),

askedBy:safe(user.name),

language:language,

timestamp:new Date().toLocaleString(),

answer:"",

status:"pending",

views:0

};

questions.push(newQuestion);

localStorage.setItem("questions",JSON.stringify(questions));

error.style.color="lightgreen";
error.innerText="Question submitted successfully!";

/* reset form */

document.getElementById("question").value="";
document.getElementById("notes").value="";
document.getElementById("professionSelect").value="";
document.getElementById("language").value="English";

}

/* AI EXPERT DETECTION */

function identifyExpert(){

let text=document.getElementById("question").value.toLowerCase();

if(!text) return;

let profession="";

if(text.includes("fever") || text.includes("medicine") || text.includes("pain") || text.includes("hospital"))
profession="doctor";

else if(text.includes("court") || text.includes("law") || text.includes("case"))
profession="lawyer";

else if(text.includes("software") || text.includes("computer") || text.includes("coding") || text.includes("app"))
profession="engineer";

else if(text.includes("exam") || text.includes("study") || text.includes("homework"))
profession="teacher";

else if(text.includes("crime") || text.includes("complaint"))
profession="police";

document.getElementById("professionSelect").value=profession;

let error=document.getElementById("errorMsg");

if(profession===""){
error.innerText="AI could not detect expert";
error.style.color="orange";
}
else{
error.innerText="AI Suggests: "+profession;
error.style.color="cyan";
}

}

/* VOICE INPUT */

function startVoice(){

const SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Voice recognition not supported");
return;
}

const recognition=new SpeechRecognition();

/* Better for India */

recognition.lang="en-IN";

recognition.start();

recognition.onresult=function(event){

let voiceText=event.results[0][0].transcript;

if(voiceText){
document.getElementById("question").value=voiceText;
}

};

}

</script>

</head>

<body>

<div class="ask-box">

<h2>Ask Your Question</h2>

<p id="errorMsg"></p>

<label>Select Language</label>

<select id="language">
<option value="English">English</option>
<option value="Telugu">Telugu</option>
</select>

<label>Describe your problem</label>

<textarea id="question"
placeholder="Explain your problem..."></textarea>

<button class="voice-btn" onclick="startVoice()">
🎤 Speak Question
</button>

<button class="ai-btn" onclick="identifyExpert()">
🤖 AI Identify Expert
</button>

<label>Select Professional</label>

<select id="professionSelect">

<option value="">Select Profession</option>

<option value="doctor">Doctor</option>
<option value="lawyer">Lawyer</option>
<option value="engineer">Engineer</option>
<option value="teacher">Teacher</option>
<option value="police">Police</option>
<option value="business">Business Expert</option>
<option value="finance">Financial Expert</option>
<option value="marketing">Marketing Expert</option>
<option value="startup">Startup Mentor</option>
<option value="it">IT Support</option>
<option value="psychologist">Psychologist</option>
<option value="career">Career Advisor</option>

</select>

<label>Optional Notes</label>

<input type="text"
id="notes"
placeholder="Extra information">

<button class="submit-btn"
onclick="submitQuestion()">
Submit Question
</button>

<div class="home-link">
<a href="index.html">⬅ Back to Home</a>
</div>

</div>

</body>
</html>
