
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ask Question - AskExpert</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Segoe UI,Arial;
}

body{
background:
linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
url("https://images.unsplash.com/photo-1518770660439-4636190af475");
background-size:cover;
background-position:center;
background-attachment:fixed;

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
color:white;
}

.ask-box{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(18px);
padding:40px;
width:520px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.25);
box-shadow:0 25px 60px rgba(0,0,0,.35);
}

h2{
text-align:center;
margin-bottom:20px;
font-size:28px;
}

textarea,select,input{
width:100%;
padding:13px 14px;
border-radius:10px;
border:none;
margin-bottom:15px;
font-size:14px;
background:rgba(255,255,255,0.2);
color:white;
outline:none;
}

/* FIX DROPDOWN TEXT VISIBILITY */

select option{
background:#203a43;
color:white;
}

textarea{
height:120px;
resize:none;
}

textarea::placeholder,
input::placeholder{
color:#eee;
}

button{
width:100%;
padding:13px;
border:none;
border-radius:10px;
font-size:15px;
cursor:pointer;
margin-top:10px;
font-weight:600;
}

.voice-btn{
background:linear-gradient(45deg,#ff5722,#ff9800);
color:white;
}

.ai-btn{
background:linear-gradient(45deg,#7b1fa2,#9c27b0);
color:white;
}

.submit-btn{
background:linear-gradient(45deg,#00c853,#4caf50);
color:white;
}

#errorMsg{
text-align:center;
margin-bottom:12px;
font-weight:bold;
}

.home-link{
text-align:center;
margin-top:15px;
}

.home-link a{
color:white;
text-decoration:none;
}

</style>

</head>

<body>

<div class="ask-box">

<h2>Ask Your Question</h2>

<p id="errorMsg"></p>

<label>Select Language</label>

<select id="language">
<option value="English">English</option>
<option value="Telugu">Telugu</option>
</select>

<label>Describe your problem</label>

<textarea id="question"
placeholder="Explain your problem..."></textarea>

<button class="voice-btn" onclick="startVoice()">
<i class="fa-solid fa-microphone"></i> Speak Question
</button>

<button class="ai-btn" onclick="identifyExpert()">
<i class="fa-solid fa-robot"></i> AI Identify Expert
</button>

<label>Select Professional</label>

<select id="professionSelect">

<option value="">Select Profession</option>

<option value="doctor">Doctor</option>
<option value="lawyer">Lawyer</option>
<option value="engineer">Engineer</option>
<option value="teacher">Teacher</option>
<option value="police">Police</option>
<option value="business">Business Expert</option>
<option value="finance">Financial Expert</option>
<option value="marketing">Marketing Expert</option>
<option value="startup">Startup Mentor</option>
<option value="it">IT Support</option>
<option value="psychologist">Psychologist</option>
<option value="career">Career Advisor</option>

</select>

<label>Optional Notes</label>

<input type="text"
id="notes"
placeholder="Extra information">

<button class="submit-btn"
onclick="submitQuestion()">
<i class="fa-solid fa-paper-plane"></i> Submit Question
</button>

<div class="home-link">
<a href="index.html">⬅ Back to Home</a>
</div>

</div>

<script>

/* SAFE TEXT */

function safe(text){
return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");
}

/* SPAM DETECTION */

function detectSpam(text){

text=text.toLowerCase();

if(
text.includes("asdf") ||
text.includes("qwerty") ||
text.includes("dummy")
) return true;

if(/(.)\1{5,}/.test(text)) return true;

return false;

}

/* LOGIN CHECK */

let user = JSON.parse(localStorage.getItem("loggedInUser"));

if(!user){
alert("Please login first");
window.location.href="login.html";
}

/* SUBMIT QUESTION */

function submitQuestion(){

let question=document.getElementById("question").value.trim();
let profession=document.getElementById("professionSelect").value;
let notes=document.getElementById("notes").value.trim();
let language=document.getElementById("language").value;

let error=document.getElementById("errorMsg");

if(question===""){
error.innerText="Please write your question";
error.style.color="red";
return;
}

if(question.length<10){
error.innerText="Question must be at least 10 characters";
error.style.color="red";
return;
}

if(detectSpam(question)){
error.innerText="Spam detected";
error.style.color="red";
return;
}

if(profession===""){
error.innerText="Please select expert";
error.style.color="red";
return;
}

/* LOAD QUESTIONS */

let questions = JSON.parse(localStorage.getItem("questions")) || [];

let newQuestion = {

id: Date.now(),

userId: user.id,
askedBy: user.name || "anonymous",

question: safe(question),
profession: profession,
notes: safe(notes),
language: language,

status:"pending",
answer:"",
views:0,

createdAt:new Date().toLocaleString()

};

questions.push(newQuestion);

localStorage.setItem("questions", JSON.stringify(questions));

error.style.color="lightgreen";
error.innerText="Question submitted successfully";

document.getElementById("question").value="";
document.getElementById("notes").value="";

}

/* AI EXPERT DETECTION */

function identifyExpert(){

let text=document.getElementById("question").value.toLowerCase();

let profession="";

if(text.includes("fever") || text.includes("medicine"))
profession="doctor";

else if(text.includes("court") || text.includes("law"))
profession="lawyer";

else if(text.includes("coding") || text.includes("software"))
profession="engineer";

else if(text.includes("exam") || text.includes("study"))
profession="teacher";

document.getElementById("professionSelect").value=profession;

}

/* VOICE INPUT */

function startVoice(){

const SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Voice recognition not supported");
return;
}

const recognition=new SpeechRecognition();

recognition.lang="en-IN";

recognition.start();

recognition.onresult=function(event){

let voiceText=event.results[0][0].transcript;

document.getElementById("question").value=voiceText;

};

}

</script>

</body>
</html>
