<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AskExpert AI Admin Panel</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{

background:
linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
url("https://images.unsplash.com/photo-1552664730-d307ca884978?w=1600")
no-repeat center/cover fixed;

padding:30px;

}

.container{

max-width:1100px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 20px 40px rgba(0,0,0,.4);

}

h1{
text-align:center;
margin-bottom:20px;
}

.section{
margin-top:40px;
}

.box{

background:#f5f7ff;
padding:15px;
margin-bottom:12px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 10px rgba(0,0,0,.1);

}

button{

padding:6px 12px;
border:none;
border-radius:6px;
margin-left:5px;
cursor:pointer;

}

.approve{background:#2ecc71;color:white;}
.reject{background:#e53935;color:white;}
.view{background:#3498db;color:white;}
.ban{background:#fb8c00;color:white;}

.alert{color:red;font-weight:600;}
.verify{color:green;font-weight:600;}

</style>

</head>

<body onload="initAdmin()">

<div class="container">

<h1>AskExpert AI Admin Panel</h1>

<div class="section">
<h2>Registered Users</h2>
<div id="users"></div>
</div>

<div class="section">
<h2>Expert Certificates</h2>
<div id="docs"></div>
</div>

<div class="section">
<h2>User Chats</h2>
<div id="chats"></div>
</div>

</div>

<script>

/* SAFE STORAGE */

function getData(key){

try{
return JSON.parse(localStorage.getItem(key)) || [];
}
catch{
return [];
}

}

/* XSS SAFE */

function safe(text){

if(!text) return "";

return text.toString()
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* ADMIN LOGIN CHECK */

function initAdmin(){

let user =
JSON.parse(localStorage.getItem("loggedInUser"))
||
JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "admin"){

alert("Admin access only");

window.location.href="login.html";

return;

}

loadUsers();
loadDocuments();
loadChats();

}

/* FAKE USER DETECTION */

function detectFakeUser(u){

if(!u.name || u.name.length < 3) return true;

if(u.email && (u.email.includes("test") || u.email.includes("fake")))
return true;

return false;

}

/* LOAD USERS */

function loadUsers(){

let users=getData("users");

let container=document.getElementById("users");

container.innerHTML="";

if(users.length===0){
container.innerHTML="<p>No users registered</p>";
return;
}

users.forEach((u,i)=>{

let fakeAlert="";

if(detectFakeUser(u)){
fakeAlert="<span class='alert'>⚠ Fake User</span>";
}

let div=document.createElement("div");

div.className="box";

div.innerHTML=`

<div>

<b>Name:</b> ${safe(u.name)} ${fakeAlert}<br>
<b>Email:</b> ${safe(u.email)}<br>
<b>Role:</b> ${safe(u.role || "user")}<br>
Status: ${u.banned ? "BANNED ❌" : "Active ✅"}

</div>

<div>

<button class="approve" onclick="approveUser(${i})">Approve</button>

<button class="ban" onclick="banUser(${i})">Ban</button>

<button class="reject" onclick="deleteUser(${i})">Delete</button>

</div>

`;

container.appendChild(div);

});

}

/* APPROVE USER */

function approveUser(i){

let users=getData("users");

users[i].verified=true;

localStorage.setItem("users",JSON.stringify(users));

alert("User approved");

loadUsers();

}

/* BAN USER */

function banUser(i){

let users=getData("users");

users[i].banned=true;

localStorage.setItem("users",JSON.stringify(users));

alert("User banned");

loadUsers();

}

/* DELETE USER */

function deleteUser(i){

if(!confirm("Delete user?")) return;

let users=getData("users");

users.splice(i,1);

localStorage.setItem("users",JSON.stringify(users));

loadUsers();

}

/* LOAD DOCUMENTS */

function loadDocuments(){

let docs=getData("documents");

let container=document.getElementById("docs");

container.innerHTML="";

if(docs.length===0){
container.innerHTML="<p>No certificates uploaded</p>";
return;
}

docs.forEach((d,i)=>{

let status=d.verified
? "<span class='verify'>Verified</span>"
: "<span class='alert'>Pending</span>";

let div=document.createElement("div");

div.className="box";

div.innerHTML=`

<div>

<b>Expert:</b> ${safe(d.name)}<br>
<b>Profession:</b> ${safe(d.profession)}<br>
Status: ${status}

</div>

<div>

<button class="view" onclick="viewDoc('${d.file}')">View</button>

<button class="approve" onclick="verifyDoc(${i})">Verify</button>

<button class="reject" onclick="rejectDoc(${i})">Reject</button>

</div>

`;

container.appendChild(div);

});

}

/* VIEW DOCUMENT */

function viewDoc(file){
window.open(file,"_blank");
}

/* VERIFY DOCUMENT */

function verifyDoc(i){

let docs=getData("documents");

docs[i].verified=true;

localStorage.setItem("documents",JSON.stringify(docs));

alert("Certificate verified");

loadDocuments();

}

/* REJECT DOCUMENT */

function rejectDoc(i){

let docs=getData("documents");

docs.splice(i,1);

localStorage.setItem("documents",JSON.stringify(docs));

loadDocuments();

}

/* LOAD CHATS */

function loadChats(){

let container=document.getElementById("chats");

container.innerHTML="";

let found=false;

for(let key in localStorage){

if(key.startsWith("chat_")){

let chats;

try{
chats=JSON.parse(localStorage.getItem(key));
}
catch{
continue;
}

found=true;

chats.forEach(c=>{

let div=document.createElement("div");

div.className="box";

div.innerHTML=`

<div>
<b>${safe(c.sender)}</b>: ${safe(c.text)}<br>
<small>${safe(c.time)}</small>
</div>

`;

container.appendChild(div);

});

}

}

if(!found){
container.innerHTML="<p>No chats available</p>";
}

}

</script>

</body>
</html>
