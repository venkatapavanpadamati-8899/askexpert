<!DOCTYPE html>
<html>
<head>

<title>Admin Panel - AskExpert</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:Segoe UI;

background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
url("https://images.unsplash.com/photo-1552664730-d307ca884978?w=1600&q=80")
no-repeat center/cover fixed;

padding:40px;
}

.container{
background:white;
max-width:1000px;
margin:auto;
padding:35px;
border-radius:18px;
box-shadow:0 20px 60px rgba(0,0,0,.3);
}

h2{text-align:center;margin-bottom:35px;}

.section{margin-bottom:40px;}

.box{
background:#fafafa;
border-radius:10px;
padding:15px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.details{max-width:70%;font-size:14px;}

button{
background:#dc3545;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
margin-left:5px;
}

button:hover{background:#b02a37;}

.alert{color:#d32f2f;font-weight:600;margin-left:6px;}
.verify{color:green;font-weight:600;}
.review{color:red;font-weight:600;}
.banned{color:#ff0000;font-weight:700;}

</style>
</head>

<body onload="loadAdmin()">

<div class="container">

<h2>Admin Panel - AskExpert</h2>

<div class="section">
<h3>Registered Users</h3>
<div id="usersList"></div>
</div>

<div class="section">
<h3>All Questions</h3>
<div id="adminQuestions"></div>
</div>

<div class="section">
<h3>Expert Ratings</h3>
<div id="ratingsList"></div>
</div>

</div>

<script>

/* SAFE STORAGE */

function getData(key){
try{
let data = JSON.parse(localStorage.getItem(key));
return data ? data : (key==="expertRatings" ? {} : []);
}catch(e){
return key==="expertRatings" ? {} : [];
}
}

/* XSS SECURITY */

function safe(text){
if(!text) return "N/A";
return text.toString()
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");
}

/* ADMIN SECURITY */

function loadAdmin(){

let user=getData("loggedInUser");

if(!user || (user.role!=="admin" && user.type!=="admin")){
alert("Admin access only");
window.location.href="login.html";
return;
}

loadUsers();
loadQuestions();
loadRatings();

}

/* VALID PROFESSIONS */

const validProfessions=[
"doctor","lawyer","engineer","teacher","police",
"arbitrator","business","lecturer","professor",
"researcher","finance","sales","marketing",
"startup","it","psychologist","career"
];

/* AI SPAM DETECTION */

function detectSpam(text){

if(!text) return true;

text=text.toLowerCase();

if(text.length<8) return true;

if(text.includes("test")||text.includes("asdf")) return true;

if(/(.)\1{5,}/.test(text)) return true;

return false;

}

/* AI FAKE USER DETECTION */

function detectFakeUser(user){

if(!user.name || user.name.length<3) return true;

if(user.email && user.email.includes("test")) return true;

return false;

}

/* AI MARKS VERIFICATION */

function verifyMarks(user){

let m10=Number(user.marks10||0);
let mInter=Number(user.marksInter||0);
let mDegree=Number(user.marksDegree||0);

let avg=(m10+mInter+mDegree)/3;

if(avg>=65) return "ai_certified";
else if(avg>=50) return "verified";
else return "review";

}

/* LOAD USERS */

function loadUsers(){

let users=getData("users");

let container=document.getElementById("usersList");
container.innerHTML="";

if(users.length===0){
container.innerHTML="<p>No users found.</p>";
return;
}

users.forEach((u,index)=>{

let div=document.createElement("div");
div.className="box";

let alertMsg="";

if(detectFakeUser(u)){
alertMsg=`<span class='alert'>⚠ Suspicious User</span>`;
}

else if(u.profession &&
!validProfessions.includes(u.profession.toLowerCase())){
alertMsg=`<span class='alert'>⚠ Suspicious Profession</span>`;
}

let status=verifyMarks(u);

let statusText="";

if(status==="ai_certified")
statusText="<span class='verify'>AI Certified 🤖</span>";
else if(status==="verified")
statusText="<span class='verify'>Verified Professional</span>";
else
statusText="<span class='review'>Admin Review</span>";

let bannedText=u.banned?"<span class='banned'>🚫 BANNED</span>":"";

div.innerHTML=`

<div class="details">

<b>Name:</b> ${safe(u.name)} ${bannedText}<br>
<b>Email:</b> ${safe(u.email)}<br>
<b>Profession:</b> ${safe(u.profession)} ${alertMsg}<br>
<b>Status:</b> ${statusText}<br>
<b>Role:</b> ${safe(u.role || "user")}

</div>

<div>

<button onclick="makeExpert(${index})">
<i class="fa-solid fa-user-tie"></i>
</button>

<button onclick="makeAdmin(${index})">
<i class="fa-solid fa-user-shield"></i>
</button>

<button onclick="banUser(${index})">
<i class="fa-solid fa-ban"></i>
</button>

<button onclick="deleteUser(${index})">
<i class="fa-solid fa-trash"></i>
</button>

</div>
`;

container.appendChild(div);

});

}

/* ROLE FUNCTIONS */

function makeExpert(index){

let users=getData("users");

users[index].role="expert";

localStorage.setItem("users",JSON.stringify(users));

alert("User promoted to Expert");

loadUsers();

}

function makeAdmin(index){

let users=getData("users");

users[index].role="admin";

localStorage.setItem("users",JSON.stringify(users));

alert("User promoted to Admin");

loadUsers();

}

/* BAN USER */

function banUser(index){

let users=getData("users");

users[index].banned=true;

localStorage.setItem("users",JSON.stringify(users));

alert("User banned");

loadUsers();

}

/* DELETE USER */

function deleteUser(index){

if(!confirm("Delete user?")) return;

let users=getData("users");

users.splice(index,1);

localStorage.setItem("users",JSON.stringify(users));

loadUsers();

}

/* LOAD QUESTIONS */

function loadQuestions(){

let questions=getData("questions");

let container=document.getElementById("adminQuestions");

container.innerHTML="";

if(questions.length===0){
container.innerHTML="<p>No questions found.</p>";
return;
}

questions.forEach((q,index)=>{

let div=document.createElement("div");
div.className="box";

let alertMsg="";

if(detectSpam(q.question)){
alertMsg=`<span class="alert">⚠ Spam Question</span>`;
}

div.innerHTML=`

<div class="details">

<b>Question:</b> ${safe(q.question)} ${alertMsg}<br>
<b>Expert:</b> ${safe(q.profession)}<br>
<b>Answer:</b> ${safe(q.answer)}

</div>

<button onclick="deleteQuestion(${index})">
<i class="fa-solid fa-trash"></i>
</button>

`;

container.appendChild(div);

});

}

/* DELETE QUESTION */

function deleteQuestion(index){

if(!confirm("Delete question?")) return;

let questions=getData("questions");

questions.splice(index,1);

localStorage.setItem("questions",JSON.stringify(questions));

loadQuestions();

}

/* LOAD RATINGS */

function loadRatings(){

let ratings=getData("expertRatings");

let container=document.getElementById("ratingsList");

container.innerHTML="";

if(Object.keys(ratings).length===0){
container.innerHTML="<p>No ratings available.</p>";
return;
}

for(let expert in ratings){

let avg=ratings[expert].count
? (ratings[expert].total/ratings[expert].count).toFixed(1)
: 0;

let div=document.createElement("div");
div.className="box";

div.innerHTML=`

<div class="details">

<b>Expert:</b> ${safe(expert)}<br>
<b>Average Rating:</b> ⭐ ${avg} (${ratings[expert].count} ratings)

</div>

<button onclick="deleteRating('${expert}')">
<i class="fa-solid fa-trash"></i>
</button>

`;

container.appendChild(div);

}

}

/* RESET RATINGS */

function deleteRating(expert){

if(!confirm("Reset ratings?")) return;

let ratings=getData("expertRatings");

delete ratings[expert];

localStorage.setItem("expertRatings",JSON.stringify(ratings));

loadRatings();

}

</script>

</body>
</html>
