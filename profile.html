<!DOCTYPE html>
<html>
<head>

<title>Expert Profile - AskExpert</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.profile-card{
background:white;
padding:40px;
width:350px;
border-radius:15px;
text-align:center;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
animation:fadeIn 1s;
}

.profile-img{
width:100px;
height:100px;
border-radius:50%;
margin-bottom:15px;
}

h2{
margin:10px 0;
}

.profession{
color:#777;
margin-bottom:10px;
}

.rating{
color:gold;
font-size:20px;
margin-bottom:10px;
}

.price{
font-size:18px;
margin-bottom:20px;
}

button{
padding:12px 20px;
border:none;
background:#28a745;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#218838;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(-30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<div class="profile-card">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="profile-img">

<h2>John Smith</h2>

<p class="profession">Criminal Lawyer</p>

<p>Experience: 10 Years</p>

<div class="rating">
⭐⭐⭐⭐⭐
</div>

<p class="price">Consultation Fee: ₹500</p>

<button>Contact Expert</button>

</div>

</body>
</html>
